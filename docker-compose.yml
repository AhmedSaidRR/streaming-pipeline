services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # S3-compatible object store (data lake). MinIO's free images were removed from
  # Docker Hub and dl.min.io (404 / 410 / quay 401), so the lake runs on SeaweedFS.
  lake:
    # Pinned by digest: the repo publishes no semantic version tags.
    image: chrislusf/seaweedfs@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer UI (browse the lake)
      - "9333:9333"   # master UI
    volumes:
      - lake_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  lake-init:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: python scripts/init_lake.py
    env_file: .env
    depends_on:
      lake:
        condition: service_healthy
    restart: "no"

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WH_USER}
      POSTGRES_PASSWORD: ${WH_PASSWORD}
      POSTGRES_DB: ${WH_DB}
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql/init_warehouse.sql:/docker-entrypoint-initdb.d/init.sql

  producer:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: python -m producer.main
    env_file: .env
    depends_on: [kafka]
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    user: root
    depends_on:
      kafka: 
        condition: service_started
      lake-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_started
    env_file: .env
    restart: on-failure
    volumes:
      - ./spark:/app/spark
      - spark_checkpoints:/checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4,org.postgresql:postgresql:42.7.3
      /app/spark/streaming_job.py

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_meta:/var/lib/postgresql/data

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on: [airflow-db, warehouse]
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@b.com || true;
      airflow scheduler & airflow webserver"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    depends_on: [warehouse]
    ports:
      - "8501:8501"

volumes:
  kafka_data:
  lake_data:
  warehouse_data:
  airflow_meta:
  spark_checkpoints:
