version: 2
models:
  - name: stg_price_windows
    columns:
      - name: symbol
        tests: [not_null]
      - name: window_start
        tests: [not_null]
      - name: avg_price
        tests: [not_null]
  - name: dim_symbol
    columns:
      - name: symbol_key
        tests: [unique, not_null]
      - name: symbol
        tests: [unique, not_null]
      - name: asset_class
        tests: [not_null]
  - name: mart_symbol_history
    columns:
      - name: valid_from
        tests: [not_null]
  - name: fct_price_1m
    columns:
      - name: symbol_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_symbol')
              field: symbol_key
  - name: mart_hourly_prices
    columns:
      - name: symbol
        tests: [not_null]
